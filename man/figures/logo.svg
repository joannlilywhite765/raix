<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#276DC3"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="ai" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="50%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="200" rx="24" fill="url(#bg)"/>
  
  <!-- R logo bracket -->
  <text x="48" y="112" font-family="monospace" font-size="72" font-weight="bold" fill="white" opacity="0.95">{</text>
  
  <!-- R symbol -->
  <text x="105" y="118" font-family="serif" font-size="64" font-weight="bold" fill="white">R</text>
  
  <!-- + symbol -->
  <text x="190" y="118" font-family="monospace" font-size="48" fill="white" opacity="0.6">+</text>
  
  <!-- AI sparkle / brain icon -->
  <text x="253" y="118" font-family="monospace" font-size="48" font-weight="bold" fill="url(#ai)">AI</text>
  
  <!-- Small x for eXperience -->
  <text x="340" y="105" font-family="monospace" font-size="24" fill="white" opacity="0.5">x</text>
  
  <!-- raix text -->
  <text x="48" y="158" font-family="monospace" font-size="24" font-weight="bold" fill="white" opacity="0.9">raix</text>
  
  <!-- Tagline -->
  <text x="48" y="180" font-family="sans-serif" font-size="12" fill="white" opacity="0.6">AI for R · Any model · RStudio</text>
</svg>
