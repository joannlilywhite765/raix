  <text x="490" y="166" font-family="monospace" font-size="10.5" fill="#c9d1d9">(</text>
  <text x="498" y="166" font-family="monospace" font-size="10.5" fill="#79c0ff">aes</text>
  <text x="520" y="166" font-family="monospace" font-size="10.5" fill="#c9d1d9">(</text>
  <text x="528" y="166" font-family="monospace" font-size="10.5" fill="#79c0ff">color</text>
