<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f8fafc"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="360" rx="14" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="360" y="42" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="#1e3a5f">raix</text>
  <text x="360" y="60" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b" letter-spacing="3">R + AI + eXperience</text>

  <!-- Flow Diagram -->
  <!-- Step 1: Input -->
  <rect x="28" y="82" width="155" height="110" rx="10" fill="#f0f4ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="28" y="82" width="155" height="26" rx="10" fill="#dbeafe"/>
  <rect x="28" y="95" width="155" height="13" fill="#dbeafe"/>
  <text x="105" y="100" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#1e40af">YOU DESCRIBE</text>
  <text x="44" y="130" font-family="monospace" font-size="10" fill="#1e3a5f">"Create a scatter plot</text>
  <text x="44" y="146" font-family="monospace" font-size="10" fill="#1e3a5f"> of mtcars colored by</text>
  <text x="44" y="162" font-family="monospace" font-size="10" fill="#1e3a5f"> cylinder count"</text>
  <text x="44" y="182" font-family="monospace" font-size="9" fill="#94a3b8">← Plain English</text>

  <!-- Arrow -->
  <text x="192" y="140" font-family="monospace" font-size="20" fill="#94a3b8">→</text>

  <!-- Step 2: AI -->
  <rect x="218" y="82" width="155" height="110" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <rect x="218" y="82" width="155" height="26" rx="10" fill="#c7d2fe"/>
  <rect x="218" y="95" width="155" height="13" fill="#c7d2fe"/>
  <text x="295" y="100" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#3730a3">AI GENERATES</text>
  <text x="234" y="130" font-family="monospace" font-size="9.5" fill="#4338ca">ollama / openai</text>
  <text x="234" y="148" font-family="monospace" font-size="9.5" fill="#4338ca">claude / groq</text>
  <text x="234" y="166" font-family="monospace" font-size="9.5" fill="#4338ca">deepseek / mistral</text>
  <text x="234" y="184" font-family="monospace" font-size="8.5" fill="#818cf8">13+ providers</text>

  <!-- Arrow -->
  <text x="382" y="140" font-family="monospace" font-size="20" fill="#94a3b8">→</text>

  <!-- Step 3: Code -->
  <rect x="408" y="82" width="155" height="110" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="408" y="82" width="155" height="26" rx="10" fill="#bbf7d0"/>
  <rect x="408" y="95" width="155" height="13" fill="#bbf7d0"/>
  <text x="485" y="100" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#166534">R CODE READY</text>
  <text x="424" y="130" font-family="monospace" font-size="10" fill="#15803d">ggplot(mtcars,</text>
  <text x="424" y="146" font-family="monospace" font-size="10" fill="#15803d">  aes(wt, mpg,</text>
  <text x="424" y="162" font-family="monospace" font-size="10" fill="#15803d">  color=cyl)) +</text>
  <text x="424" y="178" font-family="monospace" font-size="10" fill="#15803d">  geom_point()</text>

  <!-- Arrow -->
  <text x="572" y="140" font-family="monospace" font-size="20" fill="#94a3b8">→</text>

  <!-- Step 4: Execute -->
  <rect x="598" y="82" width="94" height="110" rx="10" fill="#fefce8" stroke="#fef08a" stroke-width="1.5"/>
  <rect x="598" y="82" width="94" height="26" rx="10" fill="#fef08a"/>
  <rect x="598" y="95" width="94" height="13" fill="#fef08a"/>
  <text x="645" y="100" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#854d0e">▶ RUN</text>
  <text x="612" y="134" font-family="sans-serif" font-size="9.5" fill="#a16207" text-anchor="middle">Execute in</text>
  <text x="612" y="150" font-family="sans-serif" font-size="9.5" fill="#a16207" text-anchor="middle">RStudio</text>
  <text x="612" y="172" font-family="sans-serif" font-size="9" fill="#ca8a04" text-anchor="middle">See plots,</text>
  <text x="612" y="186" font-family="sans-serif" font-size="9" fill="#ca8a04" text-anchor="middle">results</text>

  <!-- Divider -->
  <line x1="60" y2="213" x2="660" y2="213" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Bottom: What raix can do -->
  <text x="360" y="238" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#1e3a5f" letter-spacing="1">WHAT RAIX CAN DO</text>

  <!-- Capability pills -->
  <rect x="30" y="254" width="118" height="36" rx="18" fill="#f0f4ff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="89" y="275" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#1e40af">💬 Chat</text>

  <rect x="158" y="254" width="118" height="36" rx="18" fill="#f0f4ff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="217" y="275" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#1e40af">📝 Generate Code</text>

  <rect x="286" y="254" width="118" height="36" rx="18" fill="#f0f4ff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="345" y="275" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#1e40af">🐛 Debug</text>

  <rect x="414" y="254" width="118" height="36" rx="18" fill="#f0f4ff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="473" y="275" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#1e40af">📓 Notebooks</text>

  <rect x="542" y="254" width="148" height="36" rx="18" fill="#f0f4ff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="616" y="275" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#1e40af">🖥 Dashboard</text>

  <!-- Row 2 -->
  <rect x="30" y="298" width="118" height="36" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8"/>
  <text x="89" y="319" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#166534">🐍 Python</text>

  <rect x="158" y="298" width="118" height="36" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8"/>
  <text x="217" y="319" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#166534">⚡ C++ & Rcpp</text>

  <rect x="286" y="298" width="118" height="36" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8"/>
  <text x="345" y="319" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#166534">🔗 Pipeline</text>

  <rect x="414" y="298" width="118" height="36" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8"/>
  <text x="473" y="319" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#166534">⏱ Benchmark</text>

  <rect x="542" y="298" width="148" height="36" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8"/>
  <text x="616" y="319" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#166534">🔀 Parallelize</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="352" width="720" height="8" rx="4" fill="url(#brand)"/>
</svg>
