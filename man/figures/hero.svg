<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="720" height="340" rx="12" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="38" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#1e3a5f">raix</text>
  <text x="360" y="54" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b" letter-spacing="3">R + AI + eXperience</text>

  <!-- Terminal Window -->
  <rect x="30" y="72" width="660" height="198" rx="10" fill="#0f172a"/>
  <!-- Terminal title bar -->
  <rect x="30" y="72" width="660" height="28" rx="10" fill="#1e293b"/>
  <rect x="30" y="86" width="660" height="14" fill="#1e293b"/>
  <circle cx="46" cy="86" r="5" fill="#ef4444"/>
  <circle cx="62" cy="86" r="5" fill="#f59e0b"/>
  <circle cx="78" cy="86" r="5" fill="#22c55e"/>
  <text x="680" y="90" text-anchor="end" font-family="monospace" font-size="10" fill="#475569">raix — RStudio</text>

  <!-- Code lines -->
  <text x="50" y="120" font-family="monospace" font-size="11" fill="#22c55e">❯</text>
  <text x="64" y="120" font-family="monospace" font-size="11" fill="#e2e8f0">library(raix)</text>

  <text x="50" y="140" font-family="monospace" font-size="11" fill="#22c55e">❯</text>
  <text x="64" y="140" font-family="monospace" font-size="11" fill="#e2e8f0">raix_setup()</text>

  <!-- AI response -->
  <text x="50" y="164" font-family="monospace" font-size="11" fill="#818cf8">◇</text>
  <text x="64" y="164" font-family="monospace" font-size="11" fill="#94a3b8">ollama / qwen2.5-coder:7b — ready</text>

  <text x="50" y="188" font-family="monospace" font-size="11" fill="#22c55e">❯</text>
  <text x="64" y="188" font-family="monospace" font-size="11" fill="#e2e8f0">raix_generate(</text>
  <text x="80" y="204" font-family="monospace" font-size="11" fill="#f8fafc">"ggplot2 scatter plot of mtcars mpg vs wt,</text>
  <text x="80" y="220" font-family="monospace" font-size="11" fill="#f8fafc"> colored by cylinder, with trend line"</text>
  <text x="64" y="236" font-family="monospace" font-size="11" fill="#e2e8f0">)</text>

  <!-- AI code output -->
  <text x="50" y="258" font-family="monospace" font-size="11" fill="#818cf8">◇</text>
  <text x="64" y="258" font-family="monospace" font-size="11" fill="#94a3b8">ggplot(mtcars, aes(wt, mpg, color=factor(cyl))) +</text>

  <!-- Blinking cursor -->
  <rect x="478" y="248" width="8" height="13" fill="#22c55e" opacity="0.8">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom: capability row -->
  <text x="360" y="296" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">
    Chat  ·  Code Gen  ·  Debug  ·  Dashboard  ·  Python  ·  C++  ·  SQL  ·  Simulation  ·  Web
  </text>
  <text x="360" y="314" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">
    42 functions  ·  13+ providers  ·  MIT  ·  Windows-safe  ·  Small LLM optimized
  </text>

  <!-- Bottom accent bar -->
  <rect x="0" y="335" width="720" height="5" fill="url(#brand)"/>
</svg>
