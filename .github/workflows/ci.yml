name: R CMD Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::httr
            any::jsonlite
            any::cli
            any::testthat
            any::shiny
            any::rstudioapi

      - name: R CMD build + check
        run: |
          R CMD build --no-build-vignettes .
          R CMD check --no-manual --no-vignettes raix_*.tar.gz || {
            echo "=== INSTALL LOG ==="
            cat raix.Rcheck/00install.out 2>/dev/null || echo "No install log"
            echo "=== CHECK LOG ==="
            tail -50 raix.Rcheck/00check.log 2>/dev/null || echo "No check log"
            exit 1
          }

      - name: Run tests (non-blocking)
        continue-on-error: true
        run: |
          R CMD INSTALL raix_*.tar.gz
          Rscript -e 'library(raix); cat("raix v", as.character(packageVersion("raix")), "\n", sep=""); cat(length(ls("package:raix")), "functions loaded\n")'
          Rscript -e 'library(testthat); library(raix); try(testthat::test_local())' || echo "Tests completed — some require a live AI backend"
